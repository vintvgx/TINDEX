# Backend checks on every PR into Master and every push to Master.
# Railway auto-deploys Master to production, so this is the last gate before
# a broken backend goes live (e.g. 2026-10-11: app.py called an ORBEngine
# method that orb_engine.py didn't define yet — the import check catches that
# class of mistake).
#
# Placeholder API keys: importing app builds its service clients at module
# load and some raise without a key. No real secrets are needed or used —
# outbound calls fail fast and are caught (non-fatal) at boot.

name: Backend CI

on:
  pull_request:
    branches: [Master]
  push:
    branches: [Master]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      ANTHROPIC_API_KEY: ci-placeholder
      FINNHUB_API_KEY: ci-placeholder
      FMP_API_KEY: ci-placeholder
      ALPACA_LIVE_API_KEY: ci-placeholder
      ALPACA_LIVE_SECRET_KEY: ci-placeholder
      ALPACA_PAPER_API_KEY: ci-placeholder
      ALPACA_PAPER_SECRET_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: App imports (catches missing names / broken imports)
        run: timeout 120 python -c "import app; print('app import OK')"

      - name: Tests
        run: python -m pytest tests -q -W ignore::DeprecationWarning
